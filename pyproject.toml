[project]
name = "today-journal"
version = "2.0.0"
description = "Today Journal - a voice journaling companion that remembers you, on Cartesia Line"
requires-python = ">=3.10"
dependencies = [
    "cartesia-line==0.2.10",
    "upstash-redis>=1.1.0",   # serverless Redis (REST) — fast per-caller profile card
    "mem0ai>=0.1.0",          # Mem0 Platform client (hosted semantic memory)
    "httpx>=0.27.0",          # OpenRouter model listing
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]

[tool.setuptools]
py-modules = ["main", "memory", "config", "prompts"]
