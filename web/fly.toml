app = "today-journal-web"
primary_region = "iad"   # pick the region closest to your users

[build]

[http_service]
  internal_port = 8787
  force_https = true
  # Scale to zero when idle to keep cost low; first hit cold-starts (~few s),
  # then stays warm. Bump min_machines_running to 1 if you want zero cold starts.
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"        # long-lived voice WebSockets
    soft_limit = 40
    hard_limit = 50

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"   # backend measured ~71MB idle (no ML libs); plenty of headroom
